[package]
name = "prosa-adaptor-home"
version = "0.3.0"
authors = ["Jeremy HERGAULT"]
repository = "https://github.com/reneca/ProSA-Adaptor-Home"
license = "LGPL-3.0-or-later"
edition = "2024"
description = "ProSA Adaptors for Home"

[package.metadata.prosa.fetcher]
adaptor = ["bbox::FetcherBBoxAdaptor", "deye_solar::FetcherDeyeSolarAdaptor", "ecoflow::FetcherEcoFlowAdaptor", "freebox::FetcherFreeboxAdaptor", "shelly::FetcherShellyAdaptor", "nut_ups::FetcherNutUpsAdaptor"]

[dependencies]
bytes = "1"
prosa-fetcher = "0.5"
prosa = { version = "0.5", default-features = false }
serde = "1"
tokio = "1"
thiserror = "2"
hmac = "0.12"
rand = "0.9"

serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }

[dev-dependencies]
prosa-utils = { version = "0.5", default-features = false, features = ["msg"] }
url = "2"
